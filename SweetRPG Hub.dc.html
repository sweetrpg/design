<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-24670cac-7ea5-4c72-9007-54dae027c476/styles.css">
<script src="_ds/broadsheet-24670cac-7ea5-4c72-9007-54dae027c476/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>
a { color: var(--color-accent-700); text-decoration: none; }
a:hover { color: var(--color-accent); text-decoration: underline; }
[data-theme="dark"] {
  --color-bg: #1a1918;
  --color-surface: #26241f;
  --color-text: #f0efee;
  --color-neutral-300: #3a3836;
  --color-divider: #423f3b;
}
</style>
</helmet>
<div data-theme="{{ themeAttr }}" style="min-height:100vh;background:var(--color-bg);color:var(--color-text);transition:background 0.2s,color 0.2s">
  <nav class="nav">
    <div style="flex:1"></div>
  </nav>

  <div style="max-width:1160px;margin:0 auto;padding:0 clamp(20px,5vw,64px) 100px">
    <section style="padding:min(14vh,140px) 0 60px;text-align:center;display:flex;flex-direction:column;align-items:center">
      <img src="{{ logoSrc }}" alt="SweetRPG" style="width:min(220px,32vw);height:auto;display:block;margin-bottom:8px">
      <div style="font-family:var(--font-heading);font-weight:700;font-size:clamp(56px,9vw,110px);line-height:0.95;letter-spacing:-0.02em">
        <span style="color:var(--color-text)">Sweet</span><span style="color:#0a9845">RPG</span>
      </div>
      <p style="font-size:19px;font-style:italic;max-width:52ch;margin:20px 0 0;opacity:0.8">A suite of tools and services for managing your tabletop role-playing games</p>
    </section>

    <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));grid-auto-rows:1fr;align-items:stretch;column-gap:28px;row-gap:clamp(28px,6vw,56px);padding-top:20px">
      <sc-for list="{{ apps }}" as="app" hint-placeholder-count="4">
        <a href="{{ app.href }}" style="text-decoration:none;color:inherit">
          <div class="card elev-sm" style="position:relative;height:calc(100% + 20px);display:flex;flex-direction:column;gap:14px;cursor:pointer;overflow:hidden;border-radius:8px">
            <div style="position:absolute;inset:0;opacity:0.1;pointer-events:none">
              <image-slot id="{{ app.iconId }}" shape="rect" placeholder="Illustrated icon" src="{{ app.iconSrc }}"></image-slot>
            </div>
            <div style="position:relative">
              <div class="card-title" style="font-size:30px;color:#0a9845">{{ app.name }}</div>
              <div class="card-body" style="margin-top:8px">{{ app.description }}</div>
            </div>
            <div style="flex:1;position:relative"></div>
            <sc-if value="{{ app.hasStatus }}" hint-placeholder-val="{{ false }}">
              <span class="tag {{ app.statusClass }}" style="align-self:flex-start;position:relative">{{ app.status }}</span>
            </sc-if>
          </div>
        </a>
      </sc-for>
    </section>
  </div>

  <div style="position:fixed;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none">
    <span style="font-size:12px;opacity:0.55;pointer-events:auto">&copy; 2026 Pilgrimage Software &middot; <a href="https://github.com/sweetrpg" target="_blank" rel="noopener">GitHub</a></span>
    <span style="font-size:12px;opacity:0.55;pointer-events:auto">v{{ version }} &middot; built {{ buildDateRfc3339 }} / {{ buildHash }}</span>
  </div>
  <div style="position:fixed;right:20px;bottom:20px">
    <div style="position:relative">
      <button type="button" class="btn btn-ghost btn-icon" aria-label="Theme" style="color:#0a9845" onClick="{{ toggleThemeMenu }}" dangerouslySetInnerHTML="{{ themeIconHtml }}"></button>
      <sc-if value="{{ themeMenuOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;bottom:calc(100% + 6px);right:0;background:var(--color-surface);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:4px;display:flex;flex-direction:column;min-width:130px">
          <button type="button" class="btn btn-ghost" style="justify-content:flex-start;gap:8px;color:var(--color-text)" onClick="{{ setLight }}" dangerouslySetInnerHTML="{{ lightOptionHtml }}"></button>
          <button type="button" class="btn btn-ghost" style="justify-content:flex-start;gap:8px;color:var(--color-text)" onClick="{{ setDark }}" dangerouslySetInnerHTML="{{ darkOptionHtml }}"></button>
          <button type="button" class="btn btn-ghost" style="justify-content:flex-start;gap:8px;color:var(--color-text)" onClick="{{ setSystem }}" dangerouslySetInnerHTML="{{ systemOptionHtml }}"></button>
        </div>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const THEME_KEY = 'sweetrpg_theme_v1';
const BUILD_DATE_RFC3339 = '2026-07-26T00:00:00Z';
const BUILD_HASH = 'a3f9c1e';
const VERSION = '0.1.0';

class Component extends DCLogic {
  state = { theme: 'system', systemDark: false, themeMenuOpen: false };

  componentDidMount() {
    let theme = 'system';
    try { theme = localStorage.getItem(THEME_KEY) || 'system'; } catch (e) {}
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    this.setState({ theme, systemDark: mq.matches });
    this._mq = mq;
    this._onChange = (e) => this.setState({ systemDark: e.matches });
    mq.addEventListener('change', this._onChange);
  }
  componentWillUnmount() {
    if (this._mq && this._onChange) this._mq.removeEventListener('change', this._onChange);
  }
  setTheme(t) {
    this.setState({ theme: t });
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  renderVals() {
    const s = this.state;
    const resolvedDark = s.theme === 'dark' || (s.theme === 'system' && s.systemDark);

    const icons = {
      light: '<svg width="16" height="16" viewBox="0 0 256 256"><path fill="currentColor" d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm128,88a8,8,0,0,1-8,8H216a8,8,0,0,1,0-16h24A8,8,0,0,1,248,128ZM66.34,66.34a8,8,0,0,0,11.32-11.32l-16-16A8,8,0,0,0,50.34,50.34Zm0,123.32-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,117.66a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,64a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V200A8,8,0,0,0,128,192Zm0-136a72,72,0,1,0,72,72A72.08,72.08,0,0,0,128,56Zm0,128a56,56,0,1,1,56-56A56.06,56.06,0,0,1,128,184Z"></path></svg>',
      dark: '<svg width="16" height="16" viewBox="0 0 256 256"><path fill="currentColor" d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"></path></svg>',
      system: '<svg width="16" height="16" viewBox="0 0 256 256"><path fill="currentColor" d="M208,40H48A24,24,0,0,0,24,64V176a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V64A24,24,0,0,0,208,40Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V64a8,8,0,0,1,8-8H208a8,8,0,0,1,8,8ZM160,224a8,8,0,0,1-8,8H104a8,8,0,0,1,0-16h48A8,8,0,0,1,160,224Z"></path></svg>',
    };
    const apps = [
      { name: 'Catalogue', description: 'Browse, rate and review every RPG book in print.', href: 'RPG Catalogue.dc.html', hasStatus: false, iconId: 'app-icon-catalogue' },
      { name: 'Shelf', description: 'Track what you own, want, and are playing right now.', href: '#', hasStatus: true, status: 'Coming soon', statusClass: 'tag-outline', iconId: 'app-icon-shelf' },
      { name: 'Systems', description: 'Deep-dive reference on the game systems behind the books.', href: '#', hasStatus: true, status: 'Coming soon', statusClass: 'tag-outline', iconId: 'app-icon-systems' },
      { name: 'Profile', description: 'Your account, your table, your reading history.', href: '#', hasStatus: true, status: 'Coming soon', statusClass: 'tag-outline', iconId: 'app-icon-profile' },
      { name: 'Initiative!', description: 'Track turn order and initiative live at the table.', href: '#', hasStatus: true, status: 'Coming soon', statusClass: 'tag-outline', iconId: 'app-icon-initiative', iconSrc: 'assets/app-initiative.png' },
    ];

    return {
      themeAttr: resolvedDark ? 'dark' : 'light',
      logoSrc: resolvedDark ? 'assets/sweetrpg-logo-dark.png' : 'assets/sweetrpg-logo.png',
      themeIconHtml: { __html: icons[s.theme] || icons.system },
      lightOptionHtml: { __html: icons.light + '<span style="margin-left:8px">Light</span>' },
      darkOptionHtml: { __html: icons.dark + '<span style="margin-left:8px">Dark</span>' },
      systemOptionHtml: { __html: icons.system + '<span style="margin-left:8px">System</span>' },
      themeMenuOpen: s.themeMenuOpen,
      toggleThemeMenu: () => this.setState({ themeMenuOpen: !s.themeMenuOpen }),
      setLight: () => { this.setTheme('light'); this.setState({ themeMenuOpen: false }); },
      setDark: () => { this.setTheme('dark'); this.setState({ themeMenuOpen: false }); },
      setSystem: () => { this.setTheme('system'); this.setState({ themeMenuOpen: false }); },
      apps,
      buildDateRfc3339: BUILD_DATE_RFC3339,
      buildHash: BUILD_HASH,
      version: VERSION,
    };
  }
}

</script>
</body>
</html>
